server:
  port: 8082
  tomcat:
    threads:
      max: 50
    accept-count: 50
    max-connections: 100
feign:
  okhttp:
    enabled: true # 开启OKHttp功能
  sentinel:
    enabled: true  # 开启Sentinel功能,将Feign的请求加入Sentinel的簇点资源
hm:
  swagger:
    package: com.hmall.cart.controller
    title: "黑马商城购物车服务API"
    description: "黑马商城购物车服务接口文档"
  db:
    database: hm-cart
  cart:
    max-amount: 20 # 购物车商品最大数量
spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090
      http-method-specify: true # 开启请求方式前缀